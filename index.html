<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konditsioner modellari katalogi</title>
<style>
  :root {
    --ink: #0b1f33;
    --ink-2: #41556a;
    --paper: #f3f1ec;
    --card: #ffffff;
    --line: #dcd8cf;
    --inv: #0f8a7a;
    --onoff: #d9692b;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button, input { font: inherit; }

  .wrap { width: min(1200px, 92%); margin: 0 auto; }

  /* Opening block: numbers first, then the question */
  .opening { padding: 56px 0 28px; border-bottom: 1px solid var(--line); }
  .opening h1 {
    font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 6vw, 72px);
    line-height: 1.02; letter-spacing: -.02em; margin: 0 0 18px; max-width: 14ch;
  }
  .opening p { color: var(--ink-2); max-width: 52ch; margin: 0 0 28px; }
  .tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--ink); }
  .tally div { padding: 14px 18px 0 0; }
  .tally strong { display: block; font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1; }
  .tally span { font-size: 14px; color: var(--ink-2); }
  .split { margin-top: 22px; height: 12px; display: flex; border-radius: 2px; overflow: hidden; background: var(--line); }
  .split i { display: block; height: 100%; }
  .legend { display: flex; gap: 20px; font-size: 14px; color: var(--ink-2); margin-top: 10px; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

  /* Filters */
  .filters { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 18px 0; border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1 1 260px; min-width: 220px; padding: 12px 14px; border: 1px solid var(--ink); background: var(--card);
    border-radius: 2px; font-family: var(--mono); font-size: 15px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip, .seg button {
    background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 9px 13px;
    border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .chip[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg { display: flex; border: 1px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .meta { font-size: 14px; color: var(--ink-2); margin: 16px 0 0; }

  /* Model grid: each card is a sheet of spec, not a generic tile */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 22px 0 80px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px 18px 16px;
    text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: inherit;
    border-top: 6px solid var(--onoff);
  }
  .card.inv { border-top-color: var(--inv); }
  .card:hover { border-color: var(--ink); }
  .card .no { font-family: var(--mono); font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .card h3 { font-family: var(--serif); font-weight: 400; font-size: 27px; line-height: 1.1; margin: 0; }
  .card .comp { font-size: 14px; color: var(--ink-2); }
  .card .nums { display: flex; gap: 14px; margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); }
  .card .nums div { font-size: 12px; color: var(--ink-2); }
  .card .nums strong { display: block; font-family: var(--mono); font-size: 17px; color: var(--ink); font-weight: 500; }
  .tag { font-size: 12px; font-family: var(--mono); padding: 2px 7px; border-radius: 2px; color: #fff; background: var(--onoff); }
  .tag.inv { background: var(--inv); }
  .empty { grid-column: 1 / -1; padding: 40px 0; color: var(--ink-2); }

  /* Detail sheet */
  dialog {
    border: 0; padding: 0; width: min(760px, 94vw); max-height: 90vh; background: var(--paper); color: var(--ink);
    border-radius: 4px; box-shadow: 0 30px 80px rgba(11,31,51,.35);
  }
  dialog::backdrop { background: rgba(11,31,51,.55); }
  .sheet { padding: 28px 30px 30px; overflow: auto; max-height: 90vh; }
  .sheet header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .sheet h2 { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.05; margin: 0 0 6px; }
  .sheet .sub { color: var(--ink-2); font-size: 15px; margin: 0 0 18px; }
  .close { background: var(--ink); color: var(--paper); border: 0; border-radius: 2px; padding: 8px 14px; cursor: pointer; }
  .group { margin-top: 22px; }
  .group h4 { margin: 0 0 6px; font-size: 13px; font-family: var(--mono); letter-spacing: .02em; color: var(--ink-2); font-weight: 500; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; margin: 0; }
  dl div { padding: 9px 0; border-bottom: 1px solid var(--line); }
  dt { font-size: 13px; color: var(--ink-2); }
  dd { margin: 2px 0 0; font-family: var(--mono); font-size: 15px; word-break: break-word; }

  @media (max-width: 700px) {
    .tally { grid-template-columns: 1fr 1fr; }
    .tally div { padding-bottom: 14px; }
    dl { grid-template-columns: 1fr; }
    .sheet h2 { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="wrap opening">
  <h1>Har bir modelning ichki sirlari bir varaqda.</h1>
  <p>Kompressor, freon, bosim relelari va trubka o'lchamlari. Model nomini yozing yoki turini tanlang, kartochkani bosib to'liq ma'lumotni ko'ring.</p>
  <div class="tally" id="tally"></div>
  <div class="split" id="split" aria-hidden="true"></div>
  <div class="legend">
    <span><b style="background:var(--inv)"></b>Inverter (tezligi o'zgaruvchan)</span>
    <span><b style="background:var(--onoff)"></b>On/off (to'liq quvvat)</span>
  </div>
</div>

<div class="filters">
  <div class="wrap">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Model qidirish, masalan: STA1-F48" aria-label="Model qidirish">
      <div class="seg" role="group" aria-label="Ishlash turi" id="seg">
        <button data-v="all" aria-pressed="true">Hammasi</button>
        <button data-v="Inverter" aria-pressed="false">Inverter</button>
        <button data-v="On/off" aria-pressed="false">On/off</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="chips" id="chips"></div>
    </div>
    <p class="meta" id="meta"></p>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet"></div>
</dialog>

n": "4600", "capacitor": "Mavjud emas", "motor": "RD200HB 200W, 800rpm 8P DC 310V", "gasValve": "Mavjud emas", "capillary": "ERVx2", "valve4": "SHF-35B-67-06 C22707", "valveCoil": "Komplektda keladi", "highOff": "4,4MPa", "highOn": "3,8MPa", "lowOff": "0,05MPa", "lowOn": "0,15MPa", "pipes": null, "shassiArt": "323180501371", "pipeArt": "-"}];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = (v) => (v && v !== '-' && v !== 'Mavjud emas') ? v : '—';

let state = { type: 'Hammasi', speed: 'all', q: '' };

// Summary numbers
const inv = DATA.filter(d => d.speed === 'Inverter').length;
const onoff = DATA.length - inv;
const types = [...new Set(DATA.map(d => d.type))];
$('#tally').innerHTML = [
  [DATA.length, 'model'], [types.length, 'turi'], [inv, 'inverter'], [onoff, 'on/off']
].map(([n, l]) => `<div><strong>${n}</strong><span>${l}</span></div>`).join('');
$('#split').innerHTML =
  `<i style="width:${(inv / DATA.length * 100).toFixed(1)}%;background:var(--inv)"></i>` +
  `<i style="width:${(onoff / DATA.length * 100).toFixed(1)}%;background:var(--onoff)"></i>`;

// Type chips
const chipBox = $('#chips');
['Hammasi', ...types].forEach(t => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = t;
  b.setAttribute('aria-pressed', t === state.type ? 'true' : 'false');
  b.addEventListener('click', () => { state.type = t; sync(); render(); });
  chipBox.appendChild(b);
});

// Speed segmented control
$('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.speed = b.dataset.v === 'all' ? 'all' : b.dataset.v;
  sync(); render();
});

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });

function sync() {
  chipBox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.textContent === state.type ? 'true' : 'false'));
  $('#seg').querySelectorAll('button').forEach(b => {
    const on = (b.dataset.v === 'all' && state.speed === 'all') || b.dataset.v === state.speed;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function filtered() {
  return DATA.filter(d =>
    (state.type === 'Hammasi' || d.type === state.type) &&
    (state.speed === 'all' || d.speed === state.speed) &&
    (!state.q || (d.model + ' ' + d.compressor + ' ' + d.type).toLowerCase().includes(state.q))
  );
}

function render() {
  const list = filtered();
  $('#meta').textContent = `${list.length} ta model ko'rsatilmoqda`;
  const grid = $('#grid');
  if (!list.length) { grid.innerHTML = `<p class="empty">Hech narsa topilmadi. Qidiruvni yoki filtrni o'zgartiring.</p>`; return; }
  grid.innerHTML = list.map((d, i) => `
    <article class="card ${d.speed === 'Inverter' ? 'inv' : ''}" tabindex="0" data-idx="${DATA.indexOf(d)}" aria-label="${esc(d.model)} batafsil">
      <div class="no"><span>№ ${String(d.no).padStart(2, '0')}</span><span class="tag ${d.speed === 'Inverter' ? 'inv' : ''}">${d.speed}</span></div>
      <h3>${esc(d.model)}</h3>
      <div class="comp">${esc(d.type)} · ${esc(d.compressor || 'kompressor ko\'rsatilmagan')}</div>
      <div class="nums">
        <div>Freon<strong>${esc(val(d.freon))}</strong></div>
        <div>Yuqori bosim<strong>${esc(val(d.highOff))}</strong></div>
        <div>Past bosim<strong>${esc(val(d.lowOff))}</strong></div>
      </div>
    </article>`).join('');
}

// Detail sheet
function row(label, value) { return `<div><dt>${esc(label)}</dt><dd>${esc(val(value))}</dd></div>`; }
function openDetail(idx) {
  const d = DATA[idx];
  const p = d.pipes || {};
  $('#sheet').innerHTML = `
    <header>
      <div>
        <h2 id="dlgTitle">${esc(d.model)}</h2>
        <p class="sub">${esc(d.type)} · ${d.speed === 'Inverter' ? 'Inverter' : 'On/off'} · № ${String(d.no).padStart(2, '0')}</p>
      </div>
      <button class="close" id="closeBtn">Yopish</button>
    </header>

    <div class="group"><h4>KOMPRESSOR</h4>
      <dl>
        ${row('Model', d.compressor)}
        ${row('Ishlash turi', d.speed)}
        ${row('Motor', d.motor)}
        ${row('Kondensator sig\'imi', d.capacitor)}
      </dl>
    </div>

    <div class="group"><h4>FREON VA KLAPANLAR</h4>
      <dl>
        ${row('Freon (g)', d.freon)}
        ${row('Gaz kran gayka', d.gasValve)}
        ${row('Kapilyar trubka (mm)', d.capillary)}
        ${row('4 yo\'lli klapan', d.valve4)}
        ${row('Klapan katushkasi', d.valveCoil)}
      </dl>
    </div>

    <div class="group"><h4>BOSIM RELELARI</h4>
      <dl>
        ${row('Yuqori bosim: o\'chirish', d.highOff)}
        ${row('Yuqori bosim: yoqish', d.highOn)}
        ${row('Past bosim: o\'chirish', d.lowOff)}
        ${row('Past bosim: yoqish', d.lowOn)}
      </dl>
    </div>

    <div class="group"><h4>TRUBKA VA ARTIKULLAR</h4>
      <dl>
        ${row('Qismlararo suyuqlik trubkasi', p.liquid)}
        ${row('Suyuqlik trubkasi artikuli', p.liquidArt)}
        ${row('Qismlararo gaz trubkasi', p.gas)}
        ${row('Gaz trubkasi artikuli', p.gasArt)}
        ${row('Shassi artikuli', d.shassiArt)}
        ${row('Trubka yig\'ma artikuli', d.pipeArt)}
      </dl>
    </div>`;
  $('#closeBtn').addEventListener('click', () => $('#dlg').close());
  $('#dlg').showModal();
}

$('#grid').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (c) openDetail(+c.dataset.idx);
});
$('#grid').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openDetail(+e.target.dataset.idx); }
});
$('#dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg') e.target.close(); });

render();
</script>
